# E-ink Reader gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Java toolchain 自动下载 JDK 17
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.from=jdk.net